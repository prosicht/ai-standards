<!doctype html>
<!-- Entry point. CORE FILE: `npx prosicht update` overwrites it. Post content lives in js/post.js.
     Every path is relative (no leading slash): the post is served under a sub-path when published. -->
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Blog</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/theme.css">
<link rel="stylesheet" href="css/core/shell.css">
</head>
<body>

<div class="progress" aria-hidden="true"><i id="progress-fill"></i></div>

<header class="topbar" id="topbar" hidden>
  <a class="topbar-title" id="topbar-title"></a>
  <span class="topbar-left" id="topbar-left"></span>
  <button class="topbar-toc" id="toc-toggle" type="button" aria-expanded="false" aria-controls="toc">
    <i aria-hidden="true"></i><span id="toc-label"></span>
  </button>
</header>

<nav class="toc" id="toc" hidden>
  <p class="toc-title" id="toc-title"></p>
  <ol class="toc-list" id="toc-list"></ol>
</nav>

<main class="post" id="post"></main>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" hidden>
  <figure class="lb-figure">
    <img class="lb-img" id="lb-img" alt="">
    <figcaption class="lb-cap" id="lb-cap"></figcaption>
  </figure>
  <span class="lb-count" id="lb-count"></span>
  <button class="lb-btn lb-close" id="lb-close" type="button">&#215;</button>
  <button class="lb-btn lb-prev" id="lb-prev" type="button">&#8249;</button>
  <button class="lb-btn lb-next" id="lb-next" type="button">&#8250;</button>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script type="module" src="js/core/app.js"></script>
</body>
</html>
